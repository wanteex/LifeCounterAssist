# Build the ARM64 image on GitHub, publish it to GHCR, then deploy it to the Raspberry Pi
# through Tailscale. Manual only: a deploy restarts the app and drops games in progress
# (they live in memory).
name: Deploy to Raspberry Pi

on:
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        # GHCR requires lowercase repository names.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Links the GHCR package to this repository.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the Pi
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_DIR: lifecounterassist
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH key
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Tailscale already authenticates the peer; pin the host key on first contact.
          printf 'Host pi\n  HostName %s\n  User %s\n  StrictHostKeyChecking accept-new\n' "$PI_HOST" "$PI_USER" > ~/.ssh/config

      - name: Upload compose file
        run: |
          ssh pi "mkdir -p ~/$APP_DIR"
          scp deploy/pi/docker-compose.yml "pi:$APP_DIR/docker-compose.yml"

      - name: Pull and restart
        run: |
          ssh pi "cd ~/$APP_DIR && echo IMAGE=$IMAGE > .env && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"

      - name: Health check
        run: |
          ssh pi 'for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 2; done; docker compose -f ~/'"$APP_DIR"'/docker-compose.yml logs --tail 50; exit 1'
